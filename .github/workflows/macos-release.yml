name: Publish Verified Release for macOS and Windows (Manual Only)

# Explicitly triggered workflow only — never publishes a public release automatically (Requirement 16).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g., v0.2.0)"
        required: true
        type: string
      target_arch:
        description: "Target architecture (arm64, x86_64, or universal)"
        required: false
        default: "arm64"
        type: string
      draft:
        description: "Create as a draft release"
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    name: Package & Verify Windows ZIP
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ inputs.release_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Portable Core & Loopback Security Tests
        run: npm test

      - name: Build ArtifactAtlas.exe, Bundle the Runtime, ZIP & SHA-256
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Verify the ZIP (Extract, End-to-End Check, Launcher Smoke Test)
        shell: pwsh
        run: ./scripts/verify-windows-bundle.ps1

      - name: Verify the In-Place Update on Windows PowerShell 5.1 (Swap, Restore, Refusals)
        shell: powershell
        run: ./scripts/test-self-update-windows.ps1

      - name: Launch as a User Would, Close the Window, Check Real Start Menu & Store Readers
        shell: powershell
        run: ./scripts/test-windows-launch.ps1

      - name: Hand the Verified ZIP to the Publish Job
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/ArtifactAtlas-Windows.zip
            dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Package & Verify macOS, Publish Both
    needs: build-windows
    runs-on: macos-15
    env:
      TARGET_ARCH: ${{ inputs.target_arch || 'arm64' }}
      APP_VERSION: ${{ inputs.release_tag }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Standalone Node.js Runtime (v22 LTS with node:sqlite)
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Run Portable Core & Loopback Security Tests
        run: npm test

      - name: Run Native macOS Swift XCTest Suite
        run: swift test

      # Imports the Developer ID certificate into a temporary keychain. Skipped when the
      # certificate secrets are not configured; the build then falls back to ad-hoc signing.
      - name: Import Developer ID Certificate (Only When Configured)
        id: signing
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_P12_BASE64" ]]; then
            echo "No signing certificate configured; the release will be ad-hoc signed."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_FILE="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_FILE" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT_FILE"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed -E 's/^ *[0-9]+\) [0-9A-F]+ /    /'
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build Self-Contained ArtifactAtlas.app, DMG, ZIP & SHA-256 Checksums
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # CFBundleShortVersionString must be numeric (e.g. 0.2.0), so strip a leading "v" from the tag.
          export APP_VERSION="${APP_VERSION#v}"
          if [[ "$SIGNING_ENABLED" != "true" ]]; then
            unset APPLE_DEVELOPER_ID_APPLICATION
          fi
          ./scripts/package-macos.sh

      - name: Remove Temporary Signing Keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db"

      - name: Verify Mounted DMG & Read-Only End-to-End Workflow
        run: ./scripts/verify-macos-bundle.sh

      - name: Verify In-Place Update (Stage, Check, Swap)
        run: ./scripts/test-self-update-macos.sh

      - name: Fetch the Verified Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: windows-release

      # One checksum list covers every download; the Windows ZIP is checked against the
      # digest its own job computed before its line is added.
      - name: Add the Windows ZIP to the Release Files
        run: |
          (cd windows-release && shasum -a 256 -c SHA256SUMS-Windows.txt)
          cp windows-release/ArtifactAtlas-Windows.zip dist/
          cat windows-release/SHA256SUMS-Windows.txt >> dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Publish Verified Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=(--title "Artifact Atlas ${TAG}" --notes-file -)
          if [[ "$IS_DRAFT" == "true" ]]; then
            FLAGS+=(--draft)
          fi
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi

          cat <<EOF | gh release create "$TAG" \
            dist/ArtifactAtlas-macOS.dmg \
            dist/ArtifactAtlas-macOS.zip \
            dist/ArtifactAtlas-Windows.zip \
            dist/SHA256SUMS.txt \
            "${FLAGS[@]}"
          ## Artifact Atlas ${TAG}

          - **macOS** (Apple silicon, macOS 14 or later): \`ArtifactAtlas-macOS.dmg\`. Open it and drag Artifact Atlas to Applications.
          - **Windows** (10 or 11, 64-bit): \`ArtifactAtlas-Windows.zip\`. Extract it and start \`ArtifactAtlas.exe\`. The build is not signed with a certificate, so Windows asks before the first start: choose "More info", then "Run anyway".

          Both downloads carry their own Node.js runtime; nothing else has to be installed.

          ### SHA-256 Checksums
          \`\`\`
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          EOF
