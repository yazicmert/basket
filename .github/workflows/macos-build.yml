name: Build, Test & Package (macOS DMG, Windows ZIP)

on:
  push:
    branches:
      - main
      - "feat/**"
      - "release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_arch:
        description: "Target macOS architecture (arm64, x86_64, or universal)"
        required: false
        default: "arm64"
      macos_runner:
        description: "macOS runner label (e.g. macos-15, macos-14, macos-latest, or a self-hosted label)"
        required: false
        default: "macos-15"

permissions:
  contents: read

jobs:
  portable-core-linux:
    name: Portable Core Tests (Linux, Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Portable Core & Loopback Security Tests
        run: npm test

  build-and-package-windows:
    name: Test, Build & Verify ArtifactAtlas for Windows (.zip)
    runs-on: windows-latest
    env:
      APP_VERSION: "0.9.0"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Portable Core & Loopback Security Tests
        run: npm test

      - name: Build ArtifactAtlas.exe, Bundle the Runtime, ZIP & SHA-256
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Verify the ZIP (Extract, End-to-End Check, Launcher Smoke Test)
        shell: pwsh
        run: ./scripts/verify-windows-bundle.ps1

      - name: Verify the In-Place Update on Windows PowerShell 5.1 (Swap, Restore, Refusals)
        shell: powershell
        run: ./scripts/test-self-update-windows.ps1

      - name: Launch as a User Would, Close the Window, Check Real Start Menu & Store Readers
        shell: powershell
        run: ./scripts/test-windows-launch.ps1

      - name: Upload ArtifactAtlas-Windows.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtifactAtlas-Windows-zip
          path: |
            dist/ArtifactAtlas-Windows.zip
            dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 30

  build-and-package-macos:
    name: Build & Verify ArtifactAtlas.app (.dmg & .zip)
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    env:
      TARGET_ARCH: ${{ inputs.target_arch || 'arm64' }}
      APP_VERSION: "0.9.0"
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Standalone Node.js Runtime (v22 LTS with node:sqlite)
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Inspect macOS Toolchain Versions
        run: |
          sw_vers
          uname -a
          swift --version
          node -v

      - name: Run Portable Core & Loopback Security Tests
        run: npm test

      - name: Run Native macOS Swift XCTest Suite
        run: swift test

      # CI builds are always ad-hoc signed. Apple signing secrets are only used by the
      # manually triggered release workflow, so they are never exposed to push or PR runs.
      - name: Build Self-Contained ArtifactAtlas.app, DMG, ZIP & SHA-256 Checksums
        run: ./scripts/package-macos.sh

      - name: Verify Mounted DMG & Read-Only End-to-End Workflow
        run: ./scripts/verify-macos-bundle.sh

      - name: Verify In-Place Update (Stage, Check, Swap)
        run: ./scripts/test-self-update-macos.sh

      - name: Upload ArtifactAtlas-macOS.dmg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtifactAtlas-macOS-dmg
          path: |
            dist/ArtifactAtlas-macOS.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload ArtifactAtlas-macOS.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtifactAtlas-macOS-zip
          path: |
            dist/ArtifactAtlas-macOS.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Combined Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ArtifactAtlas-macOS-release-bundle
          path: |
            dist/ArtifactAtlas-macOS.dmg
            dist/ArtifactAtlas-macOS.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
